# Experiments with the model of the Bundibugyo virus disease outbreak.
#
# Each experiment has:
#   model       cases | deaths | fixed cases | joint
#                 cases, deaths: that series alone
#                 fixed cases:   deaths given the true cases, which are held at
#                                the posterior median of the model of cases alone
#                 joint:         cases and deaths together
#   date        the latest report used
#   chains      number of chains (one job each)
#   iterations  iterations of each chain
#   tail        whether the delay to a case being reported (with deaths alone,
#               to a death being recorded) has the heavier, exponential tail
#               (not with fixed cases)
#   delay       settings of the changes in the delay to a death being recorded,
#               with a label for tables (deaths and fixed cases only)
#   onset_from  earlier onset days are left out (cases and deaths only)
#   tail_prior  the prior on the heavier tail: a beta prior on its share
#               (tail_weight_alpha, tail_weight_beta) and the mean and sd of
#               the prior on its mean in days (tail_mean_mu, tail_mean_sigma),
#               with a label (cases and deaths only)
#   deaths_prior  settings of the model of deaths which replace the usual ones,
#               such as delay_prior (the prior on the mean and sd of the delay
#               to a death being recorded), with a label (fixed cases and joint)
#   cases_from  fixed cases only: the cases are those of the fit of cases
#               alone to the reports up to this date (default: 'date')
#   starts      near (the default): chains start near one another, at values
#               simple fits suggest; spread: chains start far apart
#
# To run experiments, list their names in a file of experiments/batches/ and
# push: each push starts one run of the batch whose file it changed.

defaults:
  chains: 4
  iterations: 600
  date: 2026-09-05

delays:
  seven_day: &seven_day {min_length: 7, label: "7-day segments"}
  more_changes: &more_changes {changes_expected: 4, label: "more changes"}
  seven_day_more: &seven_day_more {min_length: 7, changes_expected: 4, label: "7-day segments, more changes"}
  drift: &drift {drift: 7, spread_sd: 0.25, mean_step: 0.12, sd_step: 0.12, n_segment_steps: 2, label: "drift"}

tails:
  tight: &tight_tail {tail_weight_alpha: 4, tail_weight_beta: 46, tail_mean_mu: 40, tail_mean_sigma: 5, label: "tight tail"}

deaths_priors:
  # the delay to a death being recorded held near what a simple fit to the
  # delays seen in the reports to 1 October gives (mean 14.6, sd 13.5 days)
  tight_delay: &tight_delay {delay_prior: {mean_mu: 14, mean_sigma: 3, sd_mu: 12, sd_sigma: 3}, label: "tight death delay"}
  # a death can bring about the report of its case: a share of fatal cases
  # (uniform prior) are reported when their death is recorded, if not before.
  # Fatal cases are otherwise reported as others are.
  triggered: &triggered {triggered: {alpha: 1, beta: 1}, fatal_delay: false, label: "deaths bring reports"}
  # the time from onset to death is supplied (gamma, mean 9.3 and sd 5.5
  # days, from a review of Ebola virus disease), a death is recorded after
  # that time and then a delay which is estimated, and a fraction of fatal
  # cases (uniform prior) are counted on their day of death, not of onset.
  # These are reported after the delay from death alone. A share of deaths
  # are recorded after a long (exponential) delay from death, since deaths
  # are still being added months after onset.
  misdated: &misdated
    onset_to_death: {mean: 9.3, sd: 5.5}
    dated_by_death: {fraction: {alpha: 1, beta: 1, initial: 0.25}, n_moves: 1500}
    initial_delay: {mean: 3, sd: 2.5}
    delay_prior: {mean_mu: 4, mean_sigma: 4, sd_mu: 4, sd_sigma: 4}
    recording_tail: {weight_alpha: 1, weight_beta: 9, mean_mu: 40, mean_sigma: 20}
    fatal_delay: false
    label: "counted on day of death"
  # the same, and a death can also bring about the report of its case
  misdated_triggered: &misdated_triggered
    onset_to_death: {mean: 9.3, sd: 5.5}
    dated_by_death: {fraction: {alpha: 1, beta: 1, initial: 0.25}, n_moves: 1500}
    initial_delay: {mean: 3, sd: 2.5}
    delay_prior: {mean_mu: 4, mean_sigma: 4, sd_mu: 4, sd_sigma: 4}
    recording_tail: {weight_alpha: 1, weight_beta: 9, mean_mu: 40, mean_sigma: 20}
    triggered: {alpha: 1, beta: 1}
    fatal_delay: false
    label: "counted on day of death, deaths bring reports"
  # the same, with no change in the delay to a death being recorded among the
  # onset days first seen long after onset (to 18 July): those days share the
  # delay of the first onset days whose early reports are seen, so that the
  # deaths still being added to them months later are left to the long tail
  misdated_triggered_early: &misdated_triggered_early
    onset_to_death: {mean: 9.3, sd: 5.5}
    dated_by_death: {fraction: {alpha: 1, beta: 1, initial: 0.25}, n_moves: 1500}
    initial_delay: {mean: 3, sd: 2.5}
    delay_prior: {mean_mu: 4, mean_sigma: 4, sd_mu: 4, sd_sigma: 4}
    recording_tail: {weight_alpha: 1, weight_beta: 9, mean_mu: 40, mean_sigma: 20}
    triggered: {alpha: 1, beta: 1}
    fatal_delay: false
    recording_first_observed: true
    label: "counted on day of death, deaths bring reports, early recording delay shared"

experiments:
  # reports to 5 September, deaths alone with no heavier tail
  deaths_0905: {model: deaths, tail: false}
  deaths_seven_day_0905: {model: deaths, tail: false, delay: *seven_day}
  deaths_more_changes_0905: {model: deaths, tail: false, delay: *more_changes}
  deaths_drift_0905: {model: deaths, tail: false, delay: *drift}

  # reports to 5 September, deaths given the cases
  fixed_0905: {model: fixed cases}
  fixed_seven_day_0905: {model: fixed cases, delay: *seven_day}
  fixed_more_changes_0905: {model: fixed cases, delay: *more_changes}
  fixed_seven_day_more_0905: {model: fixed cases, delay: *seven_day_more}
  fixed_drift_0905: {model: fixed cases, delay: *drift}

  # reports to 5 September, deaths given the cases of the fit of cases alone
  # to the reports to 1 October (for the same onset days)
  fixed_october_cases_0905: {model: fixed cases, cases_from: 2026-10-01}
  fixed_october_cases_drift_0905: {model: fixed cases, cases_from: 2026-10-01, delay: *drift}

  # cases alone with the heavier tail of the delay left out or held tight
  cases_no_tail_0905: {model: cases, tail: false, iterations: 1000}
  cases_tight_tail_0905: {model: cases, tail_prior: *tight_tail, iterations: 1000}
  cases_no_tail_0915: {model: cases, date: 2026-09-15, tail: false, iterations: 1000}
  cases_tight_tail_0915: {model: cases, date: 2026-09-15, tail_prior: *tight_tail, iterations: 1000}

  # deaths given the October cases, at later dates and with the delay to a
  # death being recorded held near what the later reports show
  fixed_october_cases_0915: {model: fixed cases, date: 2026-09-15, cases_from: 2026-10-01}
  fixed_october_cases_tight_delay_0905: {model: fixed cases, cases_from: 2026-10-01, deaths_prior: *tight_delay}
  fixed_october_cases_tight_delay_drift_0905: {model: fixed cases, cases_from: 2026-10-01, deaths_prior: *tight_delay, delay: *drift}
  joint_no_tail_tight_delay_0905: {model: joint, tail: false, deaths_prior: *tight_delay, iterations: 800}

  # a death can bring about the report of its case
  fixed_october_cases_triggered_0905: {model: fixed cases, cases_from: 2026-10-01, deaths_prior: *triggered}
  fixed_october_cases_triggered_drift_0905: {model: fixed cases, cases_from: 2026-10-01, deaths_prior: *triggered, delay: *drift}
  fixed_october_cases_triggered_0915: {model: fixed cases, date: 2026-09-15, cases_from: 2026-10-01, deaths_prior: *triggered}
  fixed_cases_triggered_1001: {model: fixed cases, date: 2026-10-01, deaths_prior: *triggered}
  # the joint fits: 800 iterations in batch 6, lengthened to 3000 in batch 7
  joint_no_tail_triggered_0905: {model: joint, tail: false, deaths_prior: *triggered, iterations: 3000}
  joint_no_tail_triggered_0915: {model: joint, date: 2026-09-15, tail: false, deaths_prior: *triggered, iterations: 3000}
  joint_no_tail_triggered_1001: {model: joint, date: 2026-10-01, tail: false, deaths_prior: *triggered, iterations: 3000}
  joint_no_tail_triggered_0801: {model: joint, date: 2026-08-01, tail: false, deaths_prior: *triggered, iterations: 3000}
  joint_no_tail_triggered_0820: {model: joint, date: 2026-08-20, tail: false, deaths_prior: *triggered, iterations: 3000}

  # the time from onset to death supplied and the fraction of fatal cases
  # counted on their day of death estimated, without and with a death which
  # can bring about the report of its case
  joint_no_tail_misdated_0905: {model: joint, tail: false, deaths_prior: *misdated, iterations: 1500}
  joint_no_tail_misdated_0915: {model: joint, date: 2026-09-15, tail: false, deaths_prior: *misdated, iterations: 1500}
  joint_no_tail_misdated_1001: {model: joint, date: 2026-10-01, tail: false, deaths_prior: *misdated, iterations: 1500}
  joint_no_tail_misdated_triggered_0905: {model: joint, tail: false, deaths_prior: *misdated_triggered, iterations: 1500}
  joint_no_tail_misdated_triggered_0915: {model: joint, date: 2026-09-15, tail: false, deaths_prior: *misdated_triggered, iterations: 1500}
  joint_no_tail_misdated_triggered_1001: {model: joint, date: 2026-10-01, tail: false, deaths_prior: *misdated_triggered, iterations: 1500}

  # as above, deaths bring reports, with the early recording delay shared,
  # for reports through August and September
  joint_no_tail_misdated_triggered_early_0801: {model: joint, date: 2026-08-01, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_0809: {model: joint, date: 2026-08-09, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_0816: {model: joint, date: 2026-08-16, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_0824: {model: joint, date: 2026-08-24, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_0902: {model: joint, date: 2026-09-02, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_0909: {model: joint, date: 2026-09-09, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_0916: {model: joint, date: 2026-09-16, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_0924: {model: joint, date: 2026-09-24, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_1001: {model: joint, date: 2026-10-01, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}
  joint_no_tail_misdated_triggered_early_1007: {model: joint, date: 2026-10-07, tail: false, deaths_prior: *misdated_triggered_early, iterations: 1500}

  # cases and deaths together
  joint_1001: {model: joint, date: 2026-10-01, iterations: 800}
  joint_no_tail_0905: {model: joint, tail: false, iterations: 800}
  joint_no_tail_0915: {model: joint, date: 2026-09-15, tail: false, iterations: 800}
  joint_no_tail_1001: {model: joint, date: 2026-10-01, tail: false, iterations: 800}
  joint_tight_tail_0905: {model: joint, tail_prior: *tight_tail, iterations: 800}
  joint_tight_tail_0915: {model: joint, date: 2026-09-15, tail_prior: *tight_tail, iterations: 800}
  joint_tight_tail_1001: {model: joint, date: 2026-10-01, tail_prior: *tight_tail, iterations: 800}
  joint_no_tail_drift_0905: {model: joint, tail: false, delay: *drift, iterations: 800}
  joint_no_tail_drift_0915: {model: joint, date: 2026-09-15, tail: false, delay: *drift, iterations: 800}
  joint_no_tail_drift_1001: {model: joint, date: 2026-10-01, tail: false, delay: *drift, iterations: 800}
  joint_tight_tail_drift_0905: {model: joint, tail_prior: *tight_tail, delay: *drift, iterations: 800}
  joint_tight_tail_drift_0915: {model: joint, date: 2026-09-15, tail_prior: *tight_tail, delay: *drift, iterations: 800}
  joint_tight_tail_drift_1001: {model: joint, date: 2026-10-01, tail_prior: *tight_tail, delay: *drift, iterations: 800}

  # the same from starting values spread far apart
  fixed_spread_0905: {model: fixed cases, starts: spread}
  fixed_drift_spread_0905: {model: fixed cases, delay: *drift, starts: spread}

  # short runs to check that the workflow works
  check: {model: deaths, tail: false, delay: *drift, chains: 2, iterations: 20}
  check_fixed: {model: fixed cases, delay: *drift, chains: 2, iterations: 10}
