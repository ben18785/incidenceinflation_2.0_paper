# Runs a batch of experiments, one chain per job, and writes the results to
# the branch experiment-results. A batch is a file of experiments/batches/
# which lists names of experiments; a push which changes the file starts it.
# A chain which has not finished after about five and a half hours stops and
# saves what is needed to carry it on. A batch whose file has a line
#   continue: <id of an earlier run>
# (or a run started by hand with that id) carries on the chains of that run
# from where they stopped; with more iterations asked for in
# experiments/experiments.yml, it lengthens chains which had finished.
# A line
#   package: <owner>/<repository>@<branch>
# has the chains use that version of the model in place of the usual one.
name: experiments
run-name: ${{ inputs.batch || inputs.experiments || github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "A batch: the name of a file of experiments/batches/, without .txt"
        required: false
      experiments:
        description: "Or names of experiments, separated by commas"
        required: false
      continue_from:
        description: "The id of an earlier run whose chains are to be carried on (the number in its address)"
        required: false
  push:
    paths:
      - experiments/batches/*.txt

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      batch: ${{ steps.plan.outputs.batch }}
      continue_from: ${{ steps.plan.outputs.continue_from }}
      time_limit: ${{ steps.plan.outputs.time_limit }}
      package: ${{ steps.plan.outputs.package }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          WANTED: ${{ inputs.experiments }}
          BATCH: ${{ inputs.batch }}
          CONTINUE_FROM: ${{ inputs.continue_from }}
        run: |
          # the batches: the one asked for, or those whose files the push changed
          if [ -n "$BATCH" ]; then
            files="experiments/batches/$BATCH.txt"
          elif [ -z "$WANTED" ]; then
            files=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'experiments/batches/*.txt')
          fi
          if [ -z "$WANTED" ]; then
            if [ -z "$CONTINUE_FROM" ]; then
              CONTINUE_FROM=$(cat $files | sed -n 's/^continue:[[:space:]]*\([0-9]*\).*/\1/p' | head -n 1)
            fi
            TIME_LIMIT=$(cat $files | sed -n 's/^time_limit:[[:space:]]*\([0-9.]*\).*/\1/p' | head -n 1)
            PACKAGE_GIVEN=$(cat $files | sed -n 's/^package:[[:space:]]*\([A-Za-z0-9_.\/@-]*\).*/\1/p' | head -n 1)
            WANTED=$(cat $files | grep -v '^[[:space:]]*#' | grep -v '^continue:' | grep -v '^time_limit:' | grep -v '^package:' | grep -v '^[[:space:]]*$' | paste -sd, -)
            BATCH=$(for file in $files; do basename "$file" .txt; done | paste -sd+ -)
          fi
          echo "batch=${BATCH:-chosen}" >> "$GITHUB_OUTPUT"
          echo "continue_from=$CONTINUE_FROM" >> "$GITHUB_OUTPUT"
          echo "time_limit=${TIME_LIMIT:-320}" >> "$GITHUB_OUTPUT"
          echo "package=github::${PACKAGE_GIVEN:-ben18785/incidenceinflation_2.0@deaths}" >> "$GITHUB_OUTPUT"
          echo "Model: ${PACKAGE_GIVEN:-ben18785/incidenceinflation_2.0@deaths}"
          echo "Carrying on run: ${CONTINUE_FROM:-none}"
          echo "Batch: ${BATCH:-chosen}"
          echo "Experiments: $WANTED"
          matrix=$(yq -o=json 'explode(.)' experiments/experiments.yml | jq -c --arg wanted "$WANTED" '
            (.defaults.chains // 4) as $default
            | . as $file
            | [ $wanted | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(length > 0) ] as $names
            | [ $names[] as $name
                | ($file.experiments[$name] // error("No experiment called " + $name)) as $experiment
                | range(1; ($experiment.chains // $default) + 1)
                | {experiment: $name, chain: .} ]
            | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$matrix" | jq '.include | length')" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  chain:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    name: ${{ matrix.experiment }} ${{ matrix.chain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE: ${{ needs.plan.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::targets
            any::tarchetypes
            any::dplyr
            any::tidyr
            any::purrr
            any::ggplot2
            any::rlang
            any::yaml
            any::patchwork
            any::ggh4x
            any::matrixStats
            ${{ needs.plan.outputs.package }}
      - name: Restore the data
        env:
          BVD_DATA_KEY: ${{ secrets.BVD_DATA_KEY }}
        run: |
          printf '%s' "$BVD_DATA_KEY" > "$RUNNER_TEMP/bvd_data_key"
          BVD_DATA_KEY_FILE="$RUNNER_TEMP/bvd_data_key" scripts/decrypt_bvd_data.sh
          rm "$RUNNER_TEMP/bvd_data_key"
      - name: Fetch the chain to carry on
        if: needs.plan.outputs.continue_from != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: state-${{ matrix.experiment }}-${{ matrix.chain }}
          path: states
          run-id: ${{ needs.plan.outputs.continue_from }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the chain
        env:
          # minutes after which the chain stops, to be carried on by a later
          # run: 320 unless the batch has a line 'time_limit: <minutes>'
          BVD_TIME_LIMIT: ${{ needs.plan.outputs.time_limit }}
        run: |
          ls -l states 2>/dev/null || echo "The chain starts afresh."
          (while sleep 600; do tail -qn 1 outputs/bvd_deaths/progress/*.txt 2>/dev/null; done) &
          Rscript scripts/run_experiment_chain.R "${{ matrix.experiment }}" "${{ matrix.chain }}"
      - uses: actions/upload-artifact@v4
        with:
          name: chain-${{ matrix.experiment }}-${{ matrix.chain }}
          path: chains/*.rds
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.experiment }}-${{ matrix.chain }}
          path: states/*.rds
          retention-days: 30

  collect:
    needs: [plan, chain]
    if: always() && needs.plan.outputs.count != '0' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE: ${{ needs.plan.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::targets
            any::tarchetypes
            any::dplyr
            any::tidyr
            any::purrr
            any::ggplot2
            any::rlang
            any::yaml
            any::patchwork
            any::ggh4x
            any::matrixStats
            ${{ needs.plan.outputs.package }}
      - name: Restore the data
        env:
          BVD_DATA_KEY: ${{ secrets.BVD_DATA_KEY }}
        run: |
          printf '%s' "$BVD_DATA_KEY" > "$RUNNER_TEMP/bvd_data_key"
          BVD_DATA_KEY_FILE="$RUNNER_TEMP/bvd_data_key" scripts/decrypt_bvd_data.sh
          rm "$RUNNER_TEMP/bvd_data_key"
      - uses: actions/download-artifact@v4
        with:
          pattern: chain-*
          path: chains
          merge-multiple: true
      - name: Summarise
        run: |
          Rscript scripts/collect_experiments.R chains results
          dir="runs/$(date -u +%Y-%m-%d)_${GITHUB_RUN_NUMBER}_${{ needs.plan.outputs.batch }}"
          echo "RESULTS_DIR=$dir" >> "$GITHUB_ENV"
          {
            echo "Batch ${{ needs.plan.outputs.batch }}. Commit ${GITHUB_SHA} of ${GITHUB_REF_NAME}; model ${PACKAGE}; [files](https://github.com/${GITHUB_REPOSITORY}/tree/experiment-results/${dir})"
            echo
            cat results/summary.md
            if [ -f results/delays.png ]; then
              echo
              echo "![Delay by onset day](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/experiment-results/${dir}/delays.png)"
            fi
          } > results/README.md
          cat results/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save to the branch experiment-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch experiment-results "$url" "$RUNNER_TEMP/results"; then
            mkdir "$RUNNER_TEMP/results"
            git -C "$RUNNER_TEMP/results" init --quiet -b experiment-results
            git -C "$RUNNER_TEMP/results" remote add origin "$url"
          fi
          mkdir -p "$RUNNER_TEMP/results/$(dirname "$RESULTS_DIR")"
          cp -r results "$RUNNER_TEMP/results/$RESULTS_DIR"
          cd "$RUNNER_TEMP/results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Results of run ${GITHUB_RUN_NUMBER}"
          for attempt in 1 2 3; do
            git push --quiet origin experiment-results && break
            git pull --quiet --rebase origin experiment-results
          done
